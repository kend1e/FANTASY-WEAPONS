plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

java {
    withSourcesJar()
}

// Extract configlib classes into the mod's module for dev runs.
// NeoForge 21.1 uses JPMS module layers that prevent external library JARs
// on the bootstrap classpath from being visible to the mod layer.
// By extracting the classes into the source set output, they become part of
// the mod's own module and are visible without cross-layer reads.
def configlibDevClasses = layout.buildDirectory.dir("configlib-devonly")
configurations {
    shadow
    configlibExtract {
        extendsFrom shadow
    }
}
tasks.register('extractConfiglib', Sync) {
    from { configurations.configlibExtract.collect { zipTree(it) } }
    into configlibDevClasses
    exclude 'META-INF/**'
}
sourceSets.main.output.dir(configlibDevClasses, builtBy: 'extractConfiglib')

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':appCommon').sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':appCommon')
    compileOnly "de.exlll:configlib-yaml:4.5.0"
    shadow "de.exlll:configlib-yaml:4.5.0"
}

processResources {
    from project(':appCommon').sourceSets.main.resources

    var replaceProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

shadowJar {
    configurations = [project.configurations.shadow]
    relocate("de.exlll", "net.kenddie.exlll")
    relocate("org.snakeyaml", "net.kenddie.snakeyaml")
}

jar {
    from(project(':appCommon').sourceSets.main.output.classesDirs)
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // Exclude extracted configlib classes (dev-only; distribution uses shadowJar)
    exclude 'de/exlll/**'
    exclude 'org/snakeyaml/**'
}

sourcesJar {
    from project(':appCommon').sourceSets.main.allSource
}
