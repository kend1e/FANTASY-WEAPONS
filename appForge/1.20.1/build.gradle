import org.gradle.api.attributes.Attribute
import org.gradle.api.attributes.Category
import org.gradle.api.attributes.Usage

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.29'
    id 'net.minecraftforge.renamer' version '1.1.2'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings('official', minecraft_version)
    runs {
        configureEach {
            workingDir.set(layout.projectDirectory.dir('run'))
            systemProperty('forge.logging.markers', 'REGISTRIES')
            systemProperty('forge.logging.console.level', 'debug')
            systemProperty('forge.enabledGameTestNamespaces', mod_id)
        }
        register('client')
        register('server') { args('--nogui') }
        register('gameTestServer')
        register('data') {
            workingDir.set(layout.projectDirectory.dir('run-data'))
            args('--mod', mod_id, '--all', '--output',
                    layout.buildDirectory.dir('generated/resources/datagen').get(),
                    '--existing', layout.projectDirectory.dir('src/main/resources'))
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven(fg.forgeMaven)
    maven(fg.minecraftLibsMaven)
    mavenCentral()
}

dependencies {
    def forge = create("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // The detached launch configuration needs explicit runtime and mapping attributes.
    forge.attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(Attribute.of('net.minecraftforge.mappings.channel', String), 'official')
        attribute(Attribute.of('net.minecraftforge.mappings.version', String), minecraft_version)
    }
    implementation(minecraft.dependency(project.name, forge))
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        java.srcDir(rootProject.file('common/src/main/java'))
        resources.srcDir(layout.buildDirectory.dir('generated/resources/datagen'))
    }
    test.java.srcDir(rootProject.file('common/src/test/java'))
}

tasks.named('processResources', ProcessResources) {
    def metadata = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties(metadata)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand(metadata) }
}

tasks.named('jar', Jar) {
    archiveClassifier.set('dev')
    manifest.attributes(
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors,
    )
}

// Forge 1.20.1 requires SRG names in the distributed jar.
renamer.mappings.from(minecraft.getDependency(project.name).toSrgFile)
def releaseJar = renamer.classes(tasks.named('jar')) {
    archiveClassifier.set('')
    output.set(layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar"))
}
tasks.named('assemble') { dependsOn(releaseJar) }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact(releaseJar.flatMap { it.output }) { builtBy(releaseJar) }
        }
    }
    repositories { maven { url = layout.projectDirectory.dir('mcmodsrepo') } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
